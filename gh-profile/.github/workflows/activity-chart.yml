name: Activity chart

on:
  schedule:
    - cron: "30 1 * * *" # daily, shortly after the Metrics workflow
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - scripts/activity_chart.py
      - .github/workflows/activity-chart.yml

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Render monthly contribution chart
        env:
          # METRICS_TOKEN is a classic PAT with read:user; it can see private
          # contribution counts, which the default GITHUB_TOKEN cannot.
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || github.token }}
        run: python scripts/activity_chart.py --user ${{ github.repository_owner }} --out assets

      - name: Commit updated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          if git diff --cached --quiet; then
            echo "chart unchanged"
          else
            git commit -m "Update activity chart"
            git push
          fi
